# ============================================
# CONEXI\u00d3N A POSTGRESQL LOCAL
# ============================================
db.url=jdbc:postgresql://172.16.44.4:5432/AppSentinel
db.user=postgres
db.password=tiger

# ============================================
# TIEMPOS DE NIVELES (en segundos)
# ============================================
# Nivel 1: Aviso Preventivo (2 minutos = 120 segundos)
tiempo.aviso.preventivo=10

# Nivel 2: Bloqueo de Sesi\u00f3n (10 minutos = 600 segundos)
tiempo.bloqueo.sesion=25

# Nivel 3: Pausa de Reenfoque (25 minutos = 1500 segundos)
tiempo.pausa.reenfoque=30

# ============================================
# MODO ESTRICTO
# ============================================
# true = cierre autom\u00e1tico a los 2 min + 10 seg de aviso previo
# false = niveles progresivos: 2min \u2192 10min \u2192 25min
modo.estricto=false

# ============================================
# INTERVALO DE ESC\u00c1NER
# ============================================
# Cada cu\u00e1ntos segundos se escanean los procesos del sistema
scan.interval=5